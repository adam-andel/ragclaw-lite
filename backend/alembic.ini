# Alembic configuration for ERAG backend.
#
# Schema is owned by Alembic. The actual database URL is injected at runtime
# from app.database.DATABASE_URL inside migrations/env.py, so it always matches
# the application configuration (no need to duplicate the path here).
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The URL below is a placeholder; env.py overrides it with the app's real URL.
sqlalchemy.url = sqlite+aiosqlite:///./data/sqlite/erag.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
