# docker-compose.dev.yml
# ─────────────────────────────────────────────────────────────────────────────
# COMMITTABLE DEV CONFIG — shared across the team (unlike the old auto-merged
# docker-compose.override.yml, which was local-only and gitignored).
#
# Start the dev stack from the WSL project root (/home/adam/erag) with:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# For PRODUCTION (immutable, baked-in image, no source mounts, no --reload),
# use ONLY the base file:
#     docker compose -f docker-compose.yml up
#
# What this file does:
#   * ragclaw  — bind-mounts ./backend over the image's /app/backend and switches
#             uvicorn to --reload, so saving a .py file hot-restarts the server
#             WITHOUT rebuilding the image. PYTHONPATH=/app/backend (Dockerfile)
#             makes the mounted source what actually runs.
#   * mcp-repl — bind-mounts ./mcp over the image's /app, so editing the REPL
#             sandbox server (.py) takes effect WITHOUT rebuilding the image.
#             The base image still supplies Python + Node + pip deps; only the
#             server source is overlaid by the bind mount. Unlike the backend,
#             the MCP server has no uvicorn-style --reload. To get hot-reload in
#             dev WITHOUT touching the image or prod, just start the dev stack —
#             `--dev` automatically launches the host-side watcher in the
#             background (no separate terminal needed):
#               bash bin/sh/start.sh --dev start
#             The watcher (`compose restart mcp-repl`) fires on any ./mcp source
#             change. It is tracked by a PID file and cleaned up together with
#             the stack via `bash bin/sh/start.sh stop`. (No watchdog in the
#             image, prod untouched.) For a manual/opt-in alternative, run
#             `bash bin/sh/watch_mcp.sh --dev` directly, or restart by hand with
#             `docker compose restart mcp-repl` (cheap, no rebuild).
#   * frontend-dev — a Vite dev server with HMR; source bind-mounted, /api
#             proxied (see frontend/vite.config.*) to the `ragclaw` service inside
#             the docker network.
#
# IMPORTANT: run from the WSL project root (/home/adam/erag), NOT the Windows
# D:\ path — otherwise ./backend resolves to the Windows disk and you lose the
# ext4 speed + native inotify we migrated for.
# ─────────────────────────────────────────────────────────────────────────────

services:
  ragclaw:
    environment:
      # Dev: emit ragclaw.* INFO logs (tool decisions, LLM calls) to docker logs.
      # Production (base compose) omits this -> defaults to WARNING, so INFO is suppressed.
      - RAGCLAW_ENV=development
    volumes:
      # Overlay the host source on top of the image's /app/backend.
      # PYTHONPATH=/app/backend (set in Dockerfile) points here and takes
      # precedence over the pip-installed copy in site-packages, so the mounted
      # source is what actually runs. No :cached needed — we're on ext4.
      - ./backend:/app/backend
    # Replace the image CMD with a reload-enabled uvicorn.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "backend"]

  # ── REPL MCP Server (dev: bind-mount local source) ───────────────────────────
  # Mirror the `ragclaw` dev pattern: overlay ./mcp (host) on top of the image's
  # /app so edits to the sandbox server take effect WITHOUT rebuilding the image.
  # The base image (built from ./mcp) still supplies Python + Node + pip deps —
  # only the server source is replaced by the bind mount.
  #
  # The named volumes ragclaw_workspace / ragclaw_policy (declared in the base
  # file) continue to mount on /app/workspace and /repl-policy, on top of this
  # bind mount. The REPL identity secret is now owned by the Backend
  # (auto-generated on first boot, rotated via admin UI) and pushed to mcp-repl
  # at runtime — no longer a mounted Docker secret or the old ragclaw_auth_secret
  # volume.
  #
  # NOTE: the host entrypoint.sh is *not* executable, so we can't rely on the
  # image's `ENTRYPOINT ["./entrypoint.sh"]` under a bind mount (permission
  # denied). We wrap it with `sh` instead — the script's setup (workspace chown
  # + egress DNS via /etc/resolv.conf) still runs. PYTHONDONTWRITEBYTECODE=1 in
  # the image keeps /app from being written.
  mcp-repl:
    volumes:
      - ./mcp:/app
    # The host entrypoint.sh is not executable, so bypass the image's
    # `ENTRYPOINT ["./entrypoint.sh"]` (would fail with permission denied under
    # the bind mount) by launching it via `sh`. Replicates the base CMD args.
    entrypoint: ["sh"]
    command:
      - /app/entrypoint.sh
      - "--port"
      - "9200"
      - "--allow-dir"
      - "/app/workspace"
      - "--no-network"
      - "--max-memory-mb"
      - "512"
      - "--max-nproc"
      - "64"
      - "--max-concurrent"
      - "4"
      - "--enable-shell"
      - "--enable-javascript"

  # ── Frontend Vite dev server (HMR) ────────────────────────────────────────
  # Runs `vite` with hot-module-replacement. Source is bind-mounted so edits on
  # the WSL ext4 filesystem trigger instant HMR (native inotify, no 9P bridge).
  # /api is proxied (see frontend/vite.config.*) to the backend service `ragclaw`
  # inside the docker network. Do NOT use this in production.
  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    # Prefix with the project name so a second clone (COMPOSE_PROJECT_NAME=dev)
    # does not collide on the host-wide-unique container name. Resolves to
    # ragclaw-frontend-dev for the default project (unchanged); dev-* for others.
    container_name: ${COMPOSE_PROJECT_NAME:-ragclaw}-frontend-dev
    environment:
      # inside the docker network the backend resolves as `ragclaw`
      - VITE_PROXY_TARGET=http://ragclaw:8000
    ports:
      # RAGCLAW_FRONTEND_PORT sets the host port the Vite HMR dev server is
      # published on. Host ports are host-wide unique, so parallel clones must
      # not share one or `up` fails with "port is already allocated".
      #   set   -> published as "<RAGCLAW_FRONTEND_PORT>:5173" (pinned)
      #   unset -> published as just "5173" -> docker picks a RANDOM free host
      #            port for container :5173, so multiple clones can coexist with
      #            zero config. Resolve the real port with `compose port
      #            frontend-dev 5173` (start.sh prints it after a successful up).
      - "${RAGCLAW_FRONTEND_PORT:+${RAGCLAW_FRONTEND_PORT}:}5173"
    volumes:
      - ./frontend:/app/frontend
      # keep the image-built node_modules (host has none) across the bind mount
      - frontend_node_modules:/app/frontend/node_modules
    networks:
      - ragclaw
    depends_on:
      - ragclaw

volumes:
  # persists pnpm node_modules built inside the dev image (see Dockerfile.dev)
  frontend_node_modules:
