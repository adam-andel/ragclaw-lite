# docker-compose.dev.yml
# ─────────────────────────────────────────────────────────────────────────────
# COMMITTABLE DEV CONFIG — shared across the team (unlike the old auto-merged
# docker-compose.override.yml, which was local-only and gitignored).
#
# Start the dev stack from the WSL project root (/home/adam/erag) with:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# For PRODUCTION (immutable, baked-in image, no source mounts, no --reload),
# use ONLY the base file:
#     docker compose -f docker-compose.yml up
#
# What this file does:
#   * ragclaw  — bind-mounts ./backend over the image's /app/backend and switches
#             uvicorn to --reload, so saving a .py file hot-restarts the server
#             WITHOUT rebuilding the image. PYTHONPATH=/app/backend (Dockerfile)
#             makes the mounted source what actually runs.
#   * mcp-repl — built from the DEV image (mcp/Dockerfile.dev), which installs
#             FLOATING deps from requirements.txt then `pip freeze` pins them to
#             /opt/mcp-requirements.lock; this dev entrypoint copies that lock
#             back to HOST ./mcp/requirements.lock at startup so it can be
#             committed. The PROD image (mcp/Dockerfile) installs from the
#             committed (pinned) requirements.lock. Server source is bind-mounted
#             (./mcp -> /app) so editing a sandbox .py takes effect WITHOUT a
#             rebuild. Unlike the backend, the MCP server has no uvicorn-style
#             --reload. To get hot-reload in
#             dev WITHOUT touching the image or prod, just start the dev stack —
#             `--dev` automatically launches the host-side watcher in the
#             background (no separate terminal needed):
#               bash bin/sh/start.sh --dev start
#             The watcher (`compose restart mcp-repl`) fires on any ./mcp source
#             change. It is tracked by a PID file and cleaned up together with
#             the stack via `bash bin/sh/start.sh stop`. (No watchdog in the
#             image, prod untouched.) For a manual/opt-in alternative, run
#             `bash bin/sh/watch_mcp.sh --dev` directly, or restart by hand with
#             `docker compose restart mcp-repl` (cheap, no rebuild).
#   * frontend-dev — a Vite dev server with HMR; source bind-mounted, /api
#             proxied (see frontend/vite.config.*) to the `ragclaw` service inside
#             the docker network.
#
# IMPORTANT: run from the WSL project root (/home/adam/erag), NOT the Windows
# D:\ path — otherwise ./backend resolves to the Windows disk and you lose the
# ext4 speed + native inotify we migrated for.
# ─────────────────────────────────────────────────────────────────────────────

services:
  ragclaw:
    # Build the DEV image (backend/Dockerfile.dev) instead of the prod Dockerfile.
    # The dev image installs deps from requirements.txt's floating ranges and bakes
    # the resolved lock at /opt/backend-requirements.lock for the entrypoint to sync.
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    environment:
      # Dev: emit ragclaw.* INFO logs (tool decisions, LLM calls) to docker logs.
      # Production (base compose) omits this -> defaults to WARNING, so INFO is suppressed.
      - RAGCLAW_ENV=development
      # ── Verbose LLM request-body dump (opt-in, dev only) ──
      # The chat_with_tools FULL request body (embeds the whole SKILL.md text, ~100KB/call)
      # is logged at DEBUG by default and stays out of docker logs. To temporarily see the
      # full body for one debugging session, add the line below and `restart ragclaw-lite`:
      #     - RAGCLAW_LLM_DUMP_BODY=1
      # Then remove it (or comment it out) and `restart ragclaw-lite` again to go back to silent.
      # NOTE: setting RAGCLAW_ENV=debug is NOT enough — main.py re-applies setup_logging() on
      # every request and pins ragclaw.llm back to INFO, so the DEBUG body only shows via this flag.
    volumes:
      # Overlay the host source on top of the image's /app/backend.
      # PYTHONPATH=/app/backend (set in backend/Dockerfile.dev) points here and takes
      # precedence over the pip-installed copy in site-packages, so the mounted
      # source is what actually runs. No :cached needed — we're on ext4.
      - ./backend:/app/backend
      # Shared skills volume (Phase 7): backend writes store/* + enable/* here.
      # Mounted rw (the backend is the writer); mcp-repl mounts it ro.
      - ragclaw_skills:/ragclaw_skills
    # The DEV image bakes the resolved lock at /opt/backend-requirements.lock (outside
    # this bind-mount). This dev entrypoint copies it onto /app/backend/requirements.lock
    # at startup, writing through the bind-mount to the HOST ./backend so the lock can
    # be committed — mirroring frontend/docker-entrypoint.dev.sh. Then it launches
    # uvicorn with --reload (same as the prod CMD, just hot-reloading).
    # NOTE: --reload (and the prod --workers 1) both force a SINGLE worker — RAGClaw
    # depends on process-local singletons (LLM semaphore, BM25 index, answer cache,
    # per-process Chroma client) that must NOT be forked. Never switch this to
    # --workers N or add --workers alongside --reload.
    entrypoint: ["sh", "-c", "cp /opt/backend-requirements.lock /app/backend/requirements.lock 2>/dev/null; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend"]
    # Reports healthy only once uvicorn is actually listening on :8000 and the
    # app (incl. DB tables via lifespan) is up. frontend-dev waits on this so it
    # never proxies /api requests into a not-yet-ready backend (ECONNREFUSED 500).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s

  # ── REPL MCP Server (dev: bind-mount local source) ───────────────────────────
  # Built from the DEV image (mcp/Dockerfile.dev): installs FLOATING deps from
  # requirements.txt, then `pip freeze` pins them to /opt/mcp-requirements.lock
  # (baked OUTSIDE the /app bind-mount). This dev entrypoint copies that lock onto
  # /app/requirements.lock at startup, writing through the bind-mount to the HOST
  # ./mcp/requirements.lock so it can be committed — mirroring backend/Dockerfile.dev.
  # The PROD image (mcp/Dockerfile) installs from the committed (pinned)
  # requirements.lock and never freezes.
  #
  # Server source is overlaid by the ./mcp bind-mount, so editing a sandbox .py
  # takes effect WITHOUT rebuilding the image (the host-side watcher in
  # watch_mcp.sh fires `compose restart mcp-repl` on change). The watcher EXCLUDES
  # requirements.txt / requirements.lock so (a) dependency edits need an image
  # rebuild, not a restart, and (b) the lock write-back above can't trigger a
  # restart storm.
  #
  # The named volumes ragclaw_workspace / ragclaw_policy (declared in the base
  # file) continue to mount on /app/workspace and /repl-policy, on top of this
  # bind mount. The REPL identity secret is now owned by the Backend
  # (auto-generated on first boot, rotated via admin UI) and pushed to mcp-repl
  # at runtime — no longer a mounted Docker secret or the old ragclaw_auth_secret
  # volume.
  #
  # NOTE: the host entrypoint.sh is *not* executable, so we can't rely on the
  # image's `ENTRYPOINT ["./entrypoint.sh"]` under a bind mount (permission
  # denied). We wrap it with `sh` in the entrypoint below — the script's setup
  # (workspace chown + egress DNS via /etc/resolv.conf) still runs. PYTHONDONTWRITEBYTECODE=1
  # in the image keeps /app from being written.
  mcp-repl:
    # Build the DEV image (mcp/Dockerfile.dev) instead of the prod mcp/Dockerfile.
    # The dev image installs floating deps and bakes the resolved lock at
    # /opt/mcp-requirements.lock for the entrypoint to sync back to the host.
    build:
      context: ./mcp
      dockerfile: Dockerfile.dev
    environment:
      # Mirror base mcp-repl: sandbox child reads skills from the backend-managed
      # enable/ set via $REPL_SKILLS_DIR (replaces the removed per-user skills
      # symlink tree). Declared here so dev does not silently depend on the base
      # file's environment merging in.
      - REPL_SKILLS_DIR=/ragclaw_skills/enable
    volumes:
      - ./mcp:/app
      # Shared skills volume, READ-ONLY (Phase 7). The per-user REPL sandbox
      # reads skill files through a symlink chain resolving back into this
      # volume; writes are redirected to a sandbox-local shadow copy by the
      # server, never persisted. ro is the hard safety net. PYTHONDONTWRITEBYTECODE=1
      # is inherited from the base mcp-repl environment (and baked into the image).
      - ragclaw_skills:/ragclaw_skills:ro
    # The DEV image baked the resolved lock at /opt/mcp-requirements.lock (outside
    # this bind-mount). Copy it onto /app/requirements.lock at startup, writing
    # through the bind-mount to HOST ./mcp so the lock can be committed — mirroring
    # the backend dev flow. Then launch the server via `sh` (host entrypoint.sh is
    # not executable under the bind mount). SINGLE-ELEMENT list — NEVER split into
    # entrypoint + command (docker-compose tokenizes that and breaks `cp`).
    entrypoint: ["sh", "-c", "cp /opt/mcp-requirements.lock /app/requirements.lock 2>/dev/null; exec sh /app/entrypoint.sh --port 9200 --allow-dir /app/workspace --no-network --max-memory-mb 512 --max-nproc 64 --max-concurrent 4 --enable-shell --enable-javascript"]

  # ── Frontend Vite dev server (HMR) ────────────────────────────────────────
  # Runs `vite` with hot-module-replacement. Source is bind-mounted so edits on
  # the WSL ext4 filesystem trigger instant HMR (native inotify, no 9P bridge).
  # /api is proxied (see frontend/vite.config.*) to the backend service `ragclaw`
  # inside the docker network. Do NOT use this in production.
  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    # Prefix with the project name so a second clone (COMPOSE_PROJECT_NAME=dev)
    # does not collide on the host-wide-unique container name. Resolves to
    # ragclaw-frontend-dev for the default project (unchanged); dev-* for others.
    container_name: ${COMPOSE_PROJECT_NAME:-ragclaw}-frontend-dev
    environment:
      # inside the docker network the backend resolves as `ragclaw`
      - VITE_PROXY_TARGET=http://ragclaw:8000
    ports:
      # RAGCLAW_FRONTEND_PORT sets the host port the Vite HMR dev server is
      # published on. Host ports are host-wide unique, so parallel clones must
      # not share one or `up` fails with "port is already allocated".
      #   set   -> published as "<RAGCLAW_FRONTEND_PORT>:5173" (pinned)
      #   unset -> published as just "5173" -> docker picks a RANDOM free host
      #            port for container :5173, so multiple clones can coexist with
      #            zero config. Resolve the real port with `compose port
      #            frontend-dev 5173` (start.sh prints it after a successful up).
      - "${RAGCLAW_FRONTEND_PORT:+${RAGCLAW_FRONTEND_PORT}:}5173"
    volumes:
      # Bind-mount the whole frontend dir (must be a WSL/ext4 path — NOT an
      # NTFS D:\ mount: pnpm node_modules is thousands of symlinks and would be
      # pathologically slow / break symlinks on NTFS). node_modules now lives
      # HERE on the host, written by the entrypoint's unconditional
      # `pnpm install`, so you get a full host-side node_modules for local
      # debugging (pnpm dev / vue-tsc / IDE indexing) without entering the
      # container. The entrypoint reconciles/relinks deps from the baked store
      # (and online as a fallback) on every start, so adding a dep (e.g.
      # cronstrue) is picked up automatically on the next `start`/`reload`; no
      # manual volume reset is required (and the start.sh reset step has been
      # removed on purpose).
      - ./frontend:/app/frontend
    networks:
      - ragclaw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Wait until the backend healthcheck passes (uvicorn listening + app up),
    # so the Vite /api proxy never hits a not-yet-ready backend (ECONNREFUSED 500
    # on /api/auth/setup at page load).
    depends_on:
      ragclaw:
        condition: service_healthy
