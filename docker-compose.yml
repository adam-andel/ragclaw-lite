services:
  erag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erag-lite
    ports:
      - "${ERAG_PORT:-8000}:8000"
    volumes:
      - erag_data:/app/data
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - PUBLIC_URL=${PUBLIC_URL:-}
    restart: unless-stopped
    networks:
      - erag

  # ── REPL MCP Server (Python + Shell + JavaScript) ─────
  mcp-repl:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: erag-mcp-repl
    # No host port mapping — MCP is internal-only, accessed via Docker network.
    # File downloads go through ERAG's /api/download/{uuid}/{filename} proxy.
    environment:
      - REPL_PUBLIC_URL=http://mcp-repl:9200
      # ── Egress broker (方案 B) ──
      - REPL_EGRESS_PORT=1080        # loopback proxy port children are forced through
      - REPL_EGRESS_DNS=1            # built-in allowlist-aware DNS service on :53
    # ── Container security hardening ──
    read_only: true
    tmpfs:
      - /tmp:size=256M,exec
      - /app/workspace:size=512M,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
      - seccomp:./mcp/seccomp.json
    cap_drop:
      - ALL
    # NET_BIND_SERVICE is the only cap added back — required to bind :53 for
    # the DNS service. Without it the proxy logs a warning and still serves
    # HTTP/CONNECT (weak DNS takeover). Far below full caps.
    cap_add:
      - NET_BIND_SERVICE
    # ── Resource limits ──
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 896M
    restart: unless-stopped
    networks:
      - erag

networks:
  erag:
    driver: bridge

volumes:
  erag_data:
    driver: local
