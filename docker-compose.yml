services:
  ragclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragclaw-lite
    ports:
      - "${RAGCLAW_PORT:+${RAGCLAW_PORT}:}8000"
    volumes:
      - ragclaw_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Shared HMAC secret for signing REPL sandbox user identity. Auth + per-user
      # isolation are mandatory. If unset, the Backend auto-generates a strong
      # secret on first boot and hot-reloads it into mcp-repl via PUT /auth-secret
      # (no restart). Setting it here seeds the Backend DB and is pushed to mcp-repl.
      - REPL_AUTH_SECRET=${REPL_AUTH_SECRET:-}
      # ── REPL sandbox per-user UID allocation (random, DB-backed) ──
      # Capacity = MAX - MIN. Expand MAX later to grow capacity WITHOUT
      # affecting existing users (their stored UIDs stay fixed).
      - REPL_UID_RANGE_MIN=${REPL_UID_RANGE_MIN:-10000}
      - REPL_UID_RANGE_MAX=${REPL_UID_RANGE_MAX:-110000}
    restart: unless-stopped
    # Backend keeps its public bridge (internet egress) AND joins the internal
    # sandbox network so it can still reach mcp-repl (which is internal-only).
    # NOTE: ragclaw-internal reserves a FIXED IP (.3) so it never races the
    # egress broker for .2. Without this, the backend (started first by `up`)
    # auto-claims 172.30.0.2, and ragclaw-egress's static 172.30.0.2 collides
    # -> "failed to set up container networking: Address already in use".
    networks:
      ragclaw: {}
      ragclaw-internal:
        ipv4_address: 172.30.0.3

  # ── REPL MCP Server (Python + Shell + JavaScript) ─────
  mcp-repl:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: ragclaw-mcp-repl
    # No host port mapping — MCP is internal-only, accessed via Docker network.
    # File downloads go through RAGClaw's /api/download/{file_path} proxy, where
    # file_path may be nested (user_u<uid>/<ws>/<file>) under per-user isolation.
    # Run as root so the server can chown workdirs to per-user UIDs and
    # traverse/cleanup their 700 dirs; children are dropped to unprivileged
    # pool UIDs via setuid (root-parent + unprivileged-children model).
    user: "0"
    environment:
      - REPL_PUBLIC_URL=http://mcp-repl:9200
      # ── Egress broker (network-layer, approach B / plan A) ──
      # The broker lives in a SEPARATE container (ragclaw-egress) on ragclaw-internal.
      # This sandbox container is attached ONLY to ragclaw-internal (internal:true),
      # which has NO default route — so direct egress to the internet is
      # impossible at the routing layer. Children are forced through the broker
      # via HTTP(S)_PROXY (host = the broker's fixed internal IP); the broker
      # enforces the domain allowlist / deny policy on every request.
      - REPL_EGRESS_HOST=172.30.0.2
      - REPL_EGRESS_PORT=1080
      # Policy file is shared with the ragclaw-egress broker via a named volume so
      # backend PUT /policy pushes are seen by the broker (hot-reload preserved).
      - REPL_POLICY_FILE=/repl-policy/repl_network_policy.json
      # ── Per-user UID isolation (Backend-signed identity) ──
      # Auth + isolation are ALWAYS on (no single-account fallback). The secret
      # is auto-generated by the Backend and pushed via PUT /auth-secret at
      # startup (auto-pushed + periodic re-push). This env var only seeds an
      # optional initial value; it never disables auth.
      - REPL_AUTH_SECRET=${REPL_AUTH_SECRET:-}
      # Persisted auth secret (mirrors REPL_POLICY_FILE). mcp-repl writes the
      # Backend-pushed secret here and reads it back at startup so the workspace
      # API is ready immediately after a restart (no 403 window).
      - REPL_AUTH_SECRET_FILE=/repl-auth/repl_auth_secret.txt
    # ── Container security hardening ──
    # NOTE: /app/workspace is now a PERSISTENT named volume (ragclaw_workspace),
    # not tmpfs — user workspace files + REPL tool outputs survive mcp-repl
    # restarts. It is mounted explicitly below (rw) and is fully isolated
    # from the backend's ragclaw_data volume.
    read_only: true
    tmpfs:
      - /tmp:size=256M,exec
    security_opt:
      - no-new-privileges:true
      - seccomp:./mcp/seccomp.json
    cap_drop:
      - ALL
    # Caps required for per-user isolation: SETUID/SETGID to drop children to
    # pool UIDs, CHOWN to own workdirs to those UIDs. (NET_BIND_SERVICE removed:
    # the DNS broker moved to the separate ragclaw-egress container.)
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    # ── Persistent workspace volume ──
    # ragclaw_workspace is a dedicated named volume, isolated from the backend's
    # ragclaw_data. All user files + REPL tool outputs live here and persist
    # across container restarts (unlike the old tmpfs).
    volumes:
      - ragclaw_workspace:/app/workspace
      - ragclaw_policy:/repl-policy
      - ragclaw_auth_secret:/repl-auth
    # ── Resource limits ──
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 896M
    restart: unless-stopped
    depends_on:
      - ragclaw-egress
    # Internal-only: no route to the internet, only to ragclaw-internal peers
    # (ragclaw-egress broker + ragclaw-lite backend).
    # Fixed IP (.4) keeps it off .2 (egress broker) and .3 (backend).
    networks:
      ragclaw-internal:
        ipv4_address: 172.30.0.4

  # ── Egress broker (network-layer enforcement point) ──
  # Separate container, dual-attached:
  #   * ragclaw-internal (fixed IP 172.30.0.2) — receives proxied requests from
  #     mcp-repl (which is internal-only and can ONLY reach the internet via
  #     this broker).
  #   * ragclaw (public bridge) — provides the broker's own default route so it
  #     can forward allowed traffic to the internet.
  # The broker enforces the SAME /repl-policy/repl_network_policy.json that the
  # MCP server writes via PUT /policy (shared volume, mtime hot-reload).
  ragclaw-egress:
    build:
      context: ./mcp
      dockerfile: Dockerfile.egress
    container_name: ragclaw-egress
    user: "0"
    environment:
      - REPL_EGRESS_HOST=172.30.0.2
      - REPL_EGRESS_PORT=1080
      - REPL_EGRESS_DNS=1
      - REPL_POLICY_FILE=/repl-policy/repl_network_policy.json
      # Real upstream resolvers the built-in DNS service forwards to. The broker
      # container has a public default route (via ragclaw), so these are reachable.
      - REPL_DNS_UPSTREAM=8.8.8.8,1.1.1.1
    read_only: true
    tmpfs:
      - /tmp:size=64M,exec
    security_opt:
      - no-new-privileges:true
      - seccomp:./mcp/seccomp.json
    cap_drop:
      - ALL
    # Only NET_BIND_SERVICE is needed (the allowlist-aware DNS service binds :53).
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ragclaw_policy:/repl-policy
    restart: unless-stopped
    networks:
      ragclaw-internal:
        ipv4_address: 172.30.0.2
      ragclaw: {}

networks:
  # Public bridge: has a default gateway (NAT to internet). Hosts the backend
  # and the broker's egress side.
  ragclaw:
    driver: bridge
  # Internal-only bridge: NO gateway, so containers attached ONLY here cannot
  # reach the internet directly. This is the cornerstone of plan A — mcp-repl
  # lives here and can egress solely through ragclaw-egress (which dual-attaches).
  ragclaw-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  ragclaw_data:
    driver: local
  ragclaw_workspace:
    driver: local
  # Shared egress policy file between mcp-repl (writer) and ragclaw-egress (reader).
  ragclaw_policy:
    driver: local
  # Persisted REPL auth secret written by mcp-repl and read back at startup
  # (mirrors ragclaw_policy; removes the transient 403 window after a restart).
  ragclaw_auth_secret:
    driver: local
