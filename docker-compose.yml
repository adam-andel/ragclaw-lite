services:
  erag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erag-lite
    ports:
      - "8000:8000"
    volumes:
      - erag_data:/app/data
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    restart: unless-stopped
    networks:
      - erag

  # ── Python REPL MCP Server ──────────────────────────────
  mcp-repl:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: erag-mcp-repl
    ports:
      - "9200:9200"
    # ── Container security hardening ──
    read_only: true
    tmpfs:
      - /tmp:size=256M,exec
      - /app/workspace:size=512M
    security_opt:
      - no-new-privileges:true
      - seccomp:./mcp/seccomp.json
    cap_drop:
      - ALL
    # ── Resource limits ──
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 768M
    restart: unless-stopped
    networks:
      - erag

networks:
  erag:
    driver: bridge

volumes:
  erag_data:
    driver: local
