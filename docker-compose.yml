services:
  ragclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ragclaw}-lite
    # ── Single-worker hard constraint ──
    # The backend runs uvicorn with EXACTLY ONE worker (pinned via --workers 1 in
    # the Dockerfile CMD). RAGClaw depends on process-local singletons (LLM
    # semaphore, in-memory BM25 index, answer cache, per-process Chroma
    # PersistentClient) that must NOT be forked across multiple workers. Do NOT
    # override the command here with --workers N. To scale, run more containers
    # (horizontal), never more workers per container (vertical).
    # Backend port is NOT published to the host — all traffic is proxied
    # through the nginx service (see below). nginx reaches it on the internal
    # `ragclaw` network at ragclaw:8000.
    # The shared TLS volume is mounted rw here so the (non-root) backend can
    # write default.conf + cert/key into it; nginx mounts the same volume and
    # chmods it world-writable at startup so this write always succeeds.
    depends_on:
      - nginx
    volumes:
      - ragclaw_data:/app/data
      # Shared TLS material (cert/key + rendered nginx conf) written by the
      # backend and read (ro) by the nginx reverse proxy.
      - ragclaw_tls:/app/tls
      # Shared skills volume: backend writes the canonical store/* and the
      # enable/* symlink set here; mcp-repl mounts it read-only and the per-user
      # REPL sandbox resolves (through enable/*) back to store/* to read skill
      # files. Mounted rw on the backend, ro on mcp-repl (see mcp-repl below).
      - ragclaw_skills:/ragclaw_skills
    # ── Mounted Docker secrets (see top-level `secrets:`; files generated by
    #    bin/sh/lib/gen-secrets.sh, gitignored) ──
    # Only the AES key for config.enc remains a mounted secret. The JWT signing
    # secret and the REPL identity secret are now DB-backed (auto-generated on
    # first boot, rotated via the admin UI) — no mounted secret required.
    secrets:
      - ragclaw_config_key      # AES key for config.enc (llm/embedding API keys)
    env_file:
      - path: .env
        required: false
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      # Disable the Xet CAS storage backend (default since huggingface_hub 0.26.0).
      # It reconstructs large files via cas-server.xethub.hf.co and frequently
      # fails with 401/503 on unstable networks / mirrors. Falling back to the
      # classic HTTP/LFS download is slower but far more reliable. Must be set
      # BEFORE python imports huggingface_hub, so it lives here at container start.
      - HF_HUB_DISABLE_XET=1
      - PUBLIC_URL=${PUBLIC_URL:-}
      # ── REPL sandbox per-user UID allocation (random, DB-backed) ──
      # Capacity = MAX - MIN. Expand MAX later to grow capacity WITHOUT
      # affecting existing users (their stored UIDs stay fixed).
      - REPL_UID_RANGE_MIN=${REPL_UID_RANGE_MIN:-10000}
      - REPL_UID_RANGE_MAX=${REPL_UID_RANGE_MAX:-110000}
    restart: unless-stopped
    # ── Log rotation ── bounded json-file logs so they never grow unbounded.
    # Apply with: docker compose up -d --force-recreate <svc> (reuses the image,
    # only recreates the container + starts a fresh empty log).
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Backend keeps its public bridge (internet egress) AND joins the internal
    # sandbox network so it can still reach mcp-repl (which is internal-only).
    # NOTE: ragclaw-internal reserves a FIXED IP (.3) so it never races the
    # egress broker for .2. Without this, the backend (started first by `up`)
    # auto-claims 172.30.0.2, and ragclaw-egress's static 172.30.0.2 collides
    # -> "failed to set up container networking: Address already in use".
    networks:
      ragclaw: {}
      ragclaw-internal:
        ipv4_address: ${RAGCLAW_INTERNAL_NET:-172.30.0}.3

  # ── nginx reverse proxy (always proxies; TLS optional, prod only) ──
  # Proxies ALL traffic to ragclaw:8000 (API + SPA). The backend port is not
  # published to the host, so every request goes through nginx.
  #   HTTPS OFF: only an 80 HTTP reverse proxy is served (plain HTTP).
  #   HTTPS ON : 80 issues a 301 redirect to HTTPS, and a 443 TLS server (with
  #              HSTS) is the sole content server — i.e. HTTPS is FORCED once
  #              enabled. So HTTPS is optional to turn on, but once on it forces
  #              all traffic to HTTPS.
  # The backend writes the cert/key + rendered conf into the shared ragclaw_tls
  # volume; nginx mounts it (rw, so the non-root backend can write) and
  # hot-reloads via inotify (nginx/tls-entrypoint.sh). The entrypoint chmods the
  # dir world-writable so the backend's write always succeeds.
  # Host ports mirror the former backend-port strategy:
  #   RAGCLAW_HTTP_PORT  -> published :80  (HTTP; redirect target when HTTPS on)
  #   RAGCLAW_HTTPS_PORT -> published :443 (HTTPS, when enabled)
  # Unset => docker assigns random host ports.
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ragclaw}-nginx
    ports:
      - "${RAGCLAW_HTTP_PORT:+${RAGCLAW_HTTP_PORT}:}80"
      - "${RAGCLAW_HTTPS_PORT:+${RAGCLAW_HTTPS_PORT}:}443"
    volumes:
      - ragclaw_tls:/etc/nginx/conf.d
    networks:
      - ragclaw
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── REPL MCP Server (Python + Shell + JavaScript) ─────
  mcp-repl:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ragclaw}-mcp-repl
    # No host port mapping — MCP is internal-only, accessed via Docker network.
    # File downloads go through RAGClaw's /api/download/{file_path} proxy, where
    # file_path may be nested (user_u<uid>/<ws>/<file>) under per-user isolation.
    # Run as root so the server can chown workdirs to per-user UIDs and
    # traverse/cleanup their 700 dirs; children are dropped to unprivileged
    # pool UIDs via setuid (root-parent + unprivileged-children model).
    user: "0"
    environment:
      - REPL_PUBLIC_URL=http://mcp-repl:9200
      # ── Egress broker (network-layer, approach B / plan A) ──
      # The broker lives in a SEPARATE container (ragclaw-egress) on ragclaw-internal.
      # This sandbox container is attached ONLY to ragclaw-internal (internal:true),
      # which has NO default route — so direct egress to the internet is
      # impossible at the routing layer. Children are forced through the broker
      # via HTTP(S)_PROXY (host = the broker's fixed internal IP); the broker
      # enforces the domain allowlist / deny policy on every request.
      - REPL_EGRESS_HOST=${RAGCLAW_INTERNAL_NET:-172.30.0}.2
      - REPL_EGRESS_PORT=1080
      # Policy file is shared with the ragclaw-egress broker via a named volume so
      # backend PUT /policy pushes are seen by the broker (hot-reload preserved).
      - REPL_POLICY_FILE=/repl-policy/repl_network_policy.json
      # Never write .pyc bytecode into the shared skills volume: a skill script
      # imported by the sandbox would otherwise drop a __pycache__ next to the
      # source on the shared store (polluting it / risking cross-UID chmod). The
      # mcp Dockerfile also sets this, but pinning it here is defense-in-depth.
      - PYTHONDONTWRITEBYTECODE=1
      # Persistent container env var: the sandbox child reads skills from the
      # backend-managed enable/ set via $REPL_SKILLS_DIR. Replaces the old
      # per-user skills symlink tree (removed). _inject_skills_dir falls back to
      # this same default if the var is somehow absent.
      - REPL_SKILLS_DIR=/ragclaw_skills/enable
      # ── Per-user UID isolation (Backend-signed identity) ──
      # Auth + isolation are ALWAYS on (no single-account fallback). The REPL
      # identity HMAC secret is owned by the Backend (auto-generated on first
      # boot, rotated via admin UI) and pushed here at runtime via PUT
      # /auth-secret. It is NOT mounted as a Docker secret / file.
    # ── Container security hardening ──
    # NOTE: /app/workspace is now a PERSISTENT named volume (ragclaw_workspace),
    # not tmpfs — user workspace files + REPL tool outputs survive mcp-repl
    # restarts. It is mounted explicitly below (rw) and is fully isolated
    # from the backend's ragclaw_data volume.
    read_only: true
    tmpfs:
      - /tmp:size=256M,exec
    security_opt:
      - no-new-privileges:true
      - seccomp:./mcp/seccomp.json
    cap_drop:
      - ALL
    # Caps required for per-user isolation: SETUID/SETGID to drop children to
    # pool UIDs, CHOWN to own workdirs to those UIDs. (NET_BIND_SERVICE removed:
    # the DNS broker moved to the separate ragclaw-egress container.)
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    # ── Persistent workspace volume ──
    # ragclaw_workspace is a dedicated named volume, isolated from the backend's
    # ragclaw_data. All user files + REPL tool outputs live here and persist
    # across container restarts (unlike the old tmpfs).
    volumes:
      - ragclaw_workspace:/app/workspace
      - ragclaw_policy:/repl-policy
      # Shared skills volume, READ-ONLY here. The per-user REPL sandbox reads
      # skill files through a symlink chain that resolves back into this volume;
      # any write the LLM makes is redirected to a sandbox-local shadow copy by
      # the server (repl_mcp_server.py), never persisted to the shared store.
      # ro is the hard safety net: even a bug in the redirect logic cannot
      # corrupt the shared store from the sandbox.
      - ragclaw_skills:/ragclaw_skills:ro
    # The REPL identity HMAC secret is owned by the Backend and pushed at
    # runtime via PUT /auth-secret (no mounted secret / file in this service).
    # ── Resource limits ──
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 896M
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - ragclaw-egress
    # Internal-only: no route to the internet, only to ragclaw-internal peers
    # (ragclaw-egress broker + ragclaw-lite backend).
    # Fixed IP (.4) keeps it off .2 (egress broker) and .3 (backend).
    networks:
      ragclaw-internal:
        ipv4_address: ${RAGCLAW_INTERNAL_NET:-172.30.0}.4

  # ── Egress broker (network-layer enforcement point) ──
  # Separate container, dual-attached:
  #   * ragclaw-internal (fixed IP 172.30.0.2) — receives proxied requests from
  #     mcp-repl (which is internal-only and can ONLY reach the internet via
  #     this broker).
  #   * ragclaw (public bridge) — provides the broker's own default route so it
  #     can forward allowed traffic to the internet.
  # The broker enforces the SAME /repl-policy/repl_network_policy.json that the
  # MCP server writes via PUT /policy (shared volume, mtime hot-reload).
  ragclaw-egress:
    build:
      context: ./mcp
      dockerfile: Dockerfile.egress
    container_name: ${COMPOSE_PROJECT_NAME:-ragclaw}-egress
    user: "0"
    environment:
      - REPL_EGRESS_HOST=${RAGCLAW_INTERNAL_NET:-172.30.0}.2
      - REPL_EGRESS_PORT=1080
      - REPL_EGRESS_DNS=1
      - REPL_POLICY_FILE=/repl-policy/repl_network_policy.json
      # Real upstream resolvers the built-in DNS service forwards to. The broker
      # container has a public default route (via ragclaw), so these are reachable.
      - REPL_DNS_UPSTREAM=8.8.8.8,1.1.1.1
      # Secret-zero injection proxy (Component A): co-located in this container.
      # Binds the internal network only; not published to a host port. The backend
      # pushes skill API keys here over PUT /secret (keys live in proxy memory only).
      - SKILL_SECRET_PROXY_HOST=0.0.0.0
      - SKILL_SECRET_PROXY_PORT=9090
    # Run both the egress broker and the secret-zero injection proxy in one
    # container. The injection proxy becomes PID 1 (exec) so signals/restart
    # semantics stay sane; the egress broker runs alongside as a background child.
    command: sh -c "python egress_proxy.py & exec python skill_secret_proxy.py"
    read_only: true
    tmpfs:
      - /tmp:size=64M,exec
    security_opt:
      - no-new-privileges:true
      - seccomp:./mcp/seccomp.json
    cap_drop:
      - ALL
    # Only NET_BIND_SERVICE is needed (the allowlist-aware DNS service binds :53).
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ragclaw_policy:/repl-policy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      ragclaw-internal:
        ipv4_address: ${RAGCLAW_INTERNAL_NET:-172.30.0}.2
      ragclaw: {}

networks:
  # Public bridge: has a default gateway (NAT to internet). Hosts the backend
  # and the broker's egress side.
  ragclaw:
    driver: bridge
  # Internal-only bridge: NO gateway, so containers attached ONLY here cannot
  # reach the internet directly. This is the cornerstone of plan A — mcp-repl
  # lives here and can egress solely through ragclaw-egress (which dual-attaches).
  ragclaw-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${RAGCLAW_INTERNAL_NET:-172.30.0}.0/24

volumes:
  ragclaw_data:
    driver: local
  ragclaw_workspace:
    driver: local
  # Shared skills volume (Phase 7): backend rw (writes store/* + enable/*),
  # mcp-repl ro (per-user sandbox reads skill files through enable/*). Single
  # source of truth for skill files shared between the backend and every REPL
  # sandbox, independent of ragclaw_data and ragclaw_workspace.
  ragclaw_skills:
    driver: local
  # Shared egress policy file between mcp-repl (writer) and ragclaw-egress (reader).
  ragclaw_policy:
    driver: local
  # Shared TLS material (cert/key + rendered nginx conf) between the backend
  # (writer) and the nginx reverse proxy (reader, ro).
  ragclaw_tls:
    driver: local

# ── Mounted Docker secrets ──────────────────────────────────────────────────
# Each secret is a file under ./secrets (generated by bin/sh/lib/gen-secrets.sh,
# gitignored, chmod 600). In non-Swarm `docker compose` these are read-only
# bind-mounted files at /run/secrets/<name>. For a k8s port, map each to a
# native Secret mounted at the same path — the app code is unchanged.
secrets:
  ragclaw_config_key:
    file: ./secrets/ragclaw_config_key
