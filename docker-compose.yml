services:
  erag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erag-lite
    ports:
      - "${ERAG_PORT:-8000}:8000"
    volumes:
      - erag_data:/app/data
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Shared HMAC secret for signing REPL sandbox user identity.
      # OPTIONAL: if unset, the Backend auto-generates a strong secret on first
      # boot and hot-reloads it into mcp-repl via PUT /auth-secret (no restart).
      # If you DO set it here, it seeds the Backend DB and is pushed to mcp-repl.
      - REPL_AUTH_SECRET=${REPL_AUTH_SECRET:-}
      # ── REPL sandbox per-user UID allocation (random, DB-backed) ──
      # Capacity = MAX - MIN. Expand MAX later to grow capacity WITHOUT
      # affecting existing users (their stored UIDs stay fixed).
      - REPL_UID_RANGE_MIN=${REPL_UID_RANGE_MIN:-10000}
      - REPL_UID_RANGE_MAX=${REPL_UID_RANGE_MAX:-110000}
    restart: unless-stopped
    networks:
      - erag

  # ── REPL MCP Server (Python + Shell + JavaScript) ─────
  mcp-repl:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: erag-mcp-repl
    # No host port mapping — MCP is internal-only, accessed via Docker network.
    # File downloads go through ERAG's /api/download/{file_path} proxy, where
    # file_path may be nested (user_u<uid>/<ws>/<file>) under per-user isolation.
    # Run as root so the server can chown workdirs to per-user UIDs and
    # traverse/cleanup their 700 dirs; children are dropped to unprivileged
    # pool UIDs via setuid (root-parent + unprivileged-children model).
    user: "0"
    environment:
      - REPL_PUBLIC_URL=http://mcp-repl:9200
      # ── Egress broker (approach B) ──
      - REPL_EGRESS_PORT=1080        # loopback proxy port children are forced through
      - REPL_EGRESS_DNS=1            # built-in allowlist-aware DNS service on :53
      # ── Per-user UID isolation (Backend-signed identity) ──
      # OPTIONAL: if unset, mcp-repl starts with auth disabled and receives the
      # Backend-generated secret via PUT /auth-secret at startup (auto-pushed +
      # periodic re-push). Unset => single account mode until the secret arrives.
      - REPL_AUTH_SECRET=${REPL_AUTH_SECRET:-}
      # ── Legacy UID pool (hash fallback) ──
      # Only used for users whose Backend did NOT send a dedicated signed UID
      # (legacy accounts). New users get a random, DB-backed UID instead.
      - REPL_UID_POOL_BASE=${REPL_UID_POOL_BASE:-2000}
      - REPL_UID_POOL_SIZE=${REPL_UID_POOL_SIZE:-100}
    # ── Container security hardening ──
    read_only: true
    tmpfs:
      - /tmp:size=256M,exec
      - /app/workspace:size=512M,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
      - seccomp:./mcp/seccomp.json
    cap_drop:
      - ALL
    # Caps required for per-user isolation: SETUID/SETGID to drop children to
    # pool UIDs, CHOWN to own workdirs to those UIDs. NET_BIND_SERVICE stays for
    # the DNS broker on :53. With cap_drop:ALL the container holds ONLY these.
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    # ── Resource limits ──
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 896M
    restart: unless-stopped
    networks:
      - erag

networks:
  erag:
    driver: bridge

volumes:
  erag_data:
    driver: local
