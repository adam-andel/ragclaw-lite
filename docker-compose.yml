services:
  erag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erag-lite
    ports:
      - "8000:8000"
    volumes:
      - erag_data:/app/data
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    restart: unless-stopped

volumes:
  erag_data:
    driver: local
